<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Matchup Pulse • Win% Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-elevated: #1a2234;
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.25);
      --red: #f43f5e;
      --red-glow: rgba(244, 63, 94, 0.25);
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 18px 16px 32px;
      background: radial-gradient(circle at top center, #131c31 0%, var(--bg) 65%);
      color: var(--text-main);
      min-height: 100vh;
    }
    .container { max-width: 540px; margin: 0 auto; }

    /* Top Bar */
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .live-dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .brand h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; margin: 0; }

    .controls { display: flex; gap: 8px; align-items: center; }
    select, .refresh-btn {
      background: var(--surface-elevated); color: var(--text-main);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 7px 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .refresh-btn { padding: 7px 10px; display: flex; align-items: center; justify-content: center; }
    .refresh-btn:active { transform: scale(0.95); }

    /* Hero Win Probability Card */
    .hero-card {
      background: linear-gradient(145deg, var(--surface-elevated), var(--surface));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }
    .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .hero-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
    .hero-prob { font-size: 2.75rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; margin: 6px 0 4px; }
    .delta-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.78rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    }
    .delta-up { background: var(--green-glow); color: #34d399; }
    .delta-down { background: var(--red-glow); color: #fb7185; }
    .delta-flat { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

    /* Scoreboard Tug-of-War */
    .matchup-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 18px; }
    .team-block { display: flex; flex-direction: column; }
    .team-block.right { text-align: right; }
    .team-tag { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .team-score { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.03em; margin-top: 2px; }
    .team-proj { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    .prob-bar-track {
      height: 8px; width: 100%; background: rgba(244, 63, 94, 0.3);
      border-radius: 999px; overflow: hidden; margin-top: 12px; display: flex;
    }
    .prob-bar-fill {
      height: 100%; background: linear-gradient(90deg, #059669, #34d399);
      transition: width 0.5s ease; border-radius: 999px;
    }

    /* Chart Card */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 14px 12px;
      margin-bottom: 14px;
    }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
    .chart-title { font-size: 0.85rem; font-weight: 700; color: var(--text-main); }
    .chart-sub { font-size: 0.74rem; color: var(--text-muted); }
    .chart-wrapper { height: 270px; width: 100%; }

    /* Stat Pills Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat-pill {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 10px; text-align: center;
    }
    .stat-pill .k { font-size: 0.68rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-pill .v { font-size: 1.05rem; font-weight: 800; margin-top: 4px; }

    .footer { text-align: center; font-size: 0.74rem; color: var(--text-muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="live-dot"></div>
        <h1>Matchup Pulse</h1>
      </div>
      <div class="controls">
        <select id="weekSelect"></select>
        <button class="refresh-btn" onclick="loadData()" title="Refresh">↻</button>
      </div>
    </div>

    <div class="hero-card">
      <div class="hero-top">
        <div>
          <div class="hero-label">Win Probability</div>
          <div class="hero-prob" id="heroProb">--%</div>
        </div>
        <div id="deltaBadge" class="delta-badge delta-flat">--</div>
      </div>

      <div class="matchup-row">
        <div class="team-block">
          <span class="team-tag">My Team</span>
          <span class="team-score" id="myScore">--</span>
          <span class="team-proj" id="myProj">Proj: --</span>
        </div>
        <div class="team-block right">
          <span class="team-tag">Opponent</span>
          <span class="team-score" id="oppScore">--</span>
          <span class="team-proj" id="oppProj">Proj: --</span>
        </div>
      </div>

      <div class="prob-bar-track">
        <div class="prob-bar-fill" id="probBar" style="width: 50%"></div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">Momentum Timeline</span>
        <span class="chart-sub" id="stepCount">t = 1..--</span>
      </div>
      <div class="chart-wrapper">
        <canvas id="winChart"></canvas>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-pill">
        <div class="k">Peak Win%</div>
        <div class="v" id="peakProb" style="color: var(--green);">--%</div>
      </div>
      <div class="stat-pill">
        <div class="k">Low Win%</div>
        <div class="v" id="lowProb" style="color: var(--red);">--%</div>
      </div>
      <div class="stat-pill">
        <div class="k">Proj Margin</div>
        <div class="v" id="projMargin">--</div>
      </div>
    </div>

    <div class="footer" id="lastUpdated">Syncing live feed...</div>
  </div>

  <script>
    const CSV_URL = "https://raw.githubusercontent.com/whi1201/espn-win-tracker/refs/heads/main/win_prob_log.csv";
    let allRows = [];
    let chartInstance = null;

    // Plugin to draw a clean 50% dashed equilibrium line
    const fiftyLinePlugin = {
      id: 'fiftyLine',
      beforeDatasetsDraw(chart) {
        const { ctx, chartArea: { left, right }, scales: { y } } = chart;
        const yPos = y.getPixelForValue(50);
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
        ctx.moveTo(left, yPos);
        ctx.lineTo(right, yPos);
        ctx.stroke();
        ctx.restore();
      }
    };

    async function loadData() {
      const res = await fetch(CSV_URL + "?t=" + Date.now());
      const text = await res.text();
      const lines = text.trim().split("\n").slice(1);
      allRows = lines.map(line => {
        const [timestamp, week, my_live, opp_live, my_proj, opp_proj, win_pct] = line.split(",");
        return {
          timestamp,
          week: Number(week),
          my_live: Number(my_live),
          opp_live: Number(opp_live),
          my_proj: Number(my_proj),
          opp_proj: Number(opp_proj),
          win_pct: Number(win_pct)
        };
      }).filter(r => !isNaN(r.week));

      const weeks = [...new Set(allRows.map(r => r.week))].sort((a, b) => b - a);
      const select = document.getElementById("weekSelect");
      const currentVal = Number(select.value);
      select.innerHTML = weeks.map(w => `<option value="${w}">Week ${w}</option>`).join("");
      if (weeks.includes(currentVal)) select.value = currentVal;
      select.onchange = () => renderWeek(Number(select.value));

      if (weeks.length > 0) renderWeek(Number(select.value));
    }

    function renderWeek(weekNum) {
      const rows = allRows.filter(r => r.week === weekNum);
      if (!rows.length) return;

      const latest = rows[rows.length - 1];
      const prev = rows.length > 1 ? rows[rows.length - 2] : latest;
      const diff = latest.win_pct - prev.win_pct;

      const heroEl = document.getElementById("heroProb");
      heroEl.textContent = latest.win_pct.toFixed(1) + "%";
      heroEl.style.color = latest.win_pct >= 50 ? "#34d399" : "#fb7185";

      const badge = document.getElementById("deltaBadge");
      if (diff > 0.05) {
        badge.className = "delta-badge delta-up";
        badge.textContent = `▲ +${diff.toFixed(1)}%`;
      } else if (diff < -0.05) {
        badge.className = "delta-badge delta-down";
        badge.textContent = `▼ ${diff.toFixed(1)}%`;
      } else {
        badge.className = "delta-badge delta-flat";
        badge.textContent = "— 0.0%";
      }

      document.getElementById("myScore").textContent = latest.my_live.toFixed(2);
      document.getElementById("oppScore").textContent = latest.opp_live.toFixed(2);
      document.getElementById("myProj").textContent = `Proj: ${latest.my_proj.toFixed(1)}`;
      document.getElementById("oppProj").textContent = `Proj: ${latest.opp_proj.toFixed(1)}`;
      document.getElementById("probBar").style.width = `${Math.min(100, Math.max(0, latest.win_pct))}%`;

      const probs = rows.map(r => r.win_pct);
      document.getElementById("peakProb").textContent = Math.max(...probs).toFixed(1) + "%";
      document.getElementById("lowProb").textContent = Math.min(...probs).toFixed(1) + "%";

      const margin = latest.my_proj - latest.opp_proj;
      const marginEl = document.getElementById("projMargin");
      marginEl.textContent = (margin >= 0 ? "+" : "") + margin.toFixed(1);
      marginEl.style.color = margin >= 0 ? "#34d399" : "#fb7185";

      document.getElementById("stepCount").textContent = `t = 1 to ${rows.length}`;
      document.getElementById("lastUpdated").textContent = `Updated ${latest.timestamp} HKT`;

      const labels = rows.map((_, i) => i + 1);
      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById("winChart").getContext("2d");
      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            data: probs,
            borderWidth: 3,
            tension: 0.3,
            pointRadius: rows.length > 35 ? 1.5 : 3,
            pointHoverRadius: 6,
            pointBackgroundColor: "#f8fafc",
            segment: {
              borderColor: c => (c.p0.parsed.y >= 50 && c.p1.parsed.y >= 50) ? "#10b981" :
                                (c.p0.parsed.y < 50 && c.p1.parsed.y < 50) ? "#f43f5e" : "#38bdf8"
            },
            fill: {
              target: { value: 50 },
              above: "rgba(16, 185, 129, 0.16)",
              below: "rgba(244, 63, 94, 0.16)"
            }
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: "#1e293b",
              titleColor: "#94a3b8",
              bodyColor: "#f8fafc",
              borderColor: "rgba(255,255,255,0.1)",
              borderWidth: 1,
              padding: 10,
              displayColors: false,
              callbacks: {
                title: items => `t = ${items[0].label} • ${rows[items[0].dataIndex].timestamp}`,
                label: item => {
                  const r = rows[item.dataIndex];
                  return [
                    `Win Prob: ${r.win_pct.toFixed(1)}%`,
                    `Score: ${r.my_live.toFixed(1)} – ${r.opp_live.toFixed(1)}`,
                    `Proj: ${r.my_proj.toFixed(1)} – ${r.opp_proj.toFixed(1)}`
                  ];
                }
              }
            }
          },
          scales: {
            x: {
              ticks: { color: "#64748b", maxTicksLimit: 8, font: { size: 11 } },
              grid: { display: false }
            },
            y: {
              min: 0,
              max: 100,
              ticks: { color: "#64748b", stepSize: 25, font: { size: 11 }, callback: v => v + "%" },
              grid: { color: "rgba(148, 163, 184, 0.08)" }
            }
          }
        },
        plugins: [fiftyLinePlugin]
      });
    }

    loadData();
  </script>
</body>
</html>
