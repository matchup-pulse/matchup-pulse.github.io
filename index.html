      --accent: #38bdf8;

    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 18px 16px 36px;
      background: radial-gradient(circle at top center, #131c31 0%, var(--bg) 65%);
      color: var(--text-main); min-height: 100vh;
    }
    .container { max-width: 540px; margin: 0 auto; }

    /* Top Header with Team Name + Switcher Dropdown */
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
    .team-header { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .live-dot {
      flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .team-switcher-wrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .active-team-title {
      font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .team-select {
      background: var(--surface-elevated); color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px;
      padding: 4px 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
      max-width: 145px;
    }

    .right-controls { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    select.week-select {
      background: var(--surface-elevated); color: var(--text-main);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 7px 10px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
    }
    .add-btn {
      background: rgba(56, 189, 248, 0.15); color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 10px;
      padding: 7px 10px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    }

    /* Hero Card */
    .hero-card {
      background: linear-gradient(145deg, var(--surface-elevated), var(--surface));
      border: 1px solid var(--border); border-radius: 20px; padding: 20px;
      margin-bottom: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .sport-pill {
      display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase;

    }
