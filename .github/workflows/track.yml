name: Track ESPN Win Probability

on:
  workflow_dispatch:
  schedule:
    # Check every 10 mins 24/7; tracker.py exits immediately unless a real game is live
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run tracker
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python tracker.py
      - name: Save updated logs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add win_prob_log.csv logs/ || true
          git commit -m "Update win probability logs" || exit 0
          git push
