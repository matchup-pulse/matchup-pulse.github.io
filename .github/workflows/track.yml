name: Track ESPN Win Probability

on:
  workflow_dispatch: # Lets you click a button to test it anytime
  schedule:
    # Runs every 15 mins during NFL game windows (converted to UTC)
    - cron: '*/15 0-5 * * 1,2,5'
    - cron: '*/15 17-23 * * 0'

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas matplotlib
      - name: Run tracker
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python tracker.py
      - name: Save updated chart and log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add win_prob_log.csv win_prob_chart.png
          git commit -m "Update win probability chart" || exit 0
          git push
