name: Track ESPN Win Probability

on:
  workflow_dispatch:
  schedule:
    # Every 10 mins during live NFL game windows (UTC)
    # Sun early/late/SNF (1:00 PM - 11:59 PM ET -> 18:00 - 04:50 UTC)
    - cron: '*/10 18-23 * * 0'
    - cron: '*/10 0-4 * * 1'
    # Mon MNF & Thu TNF (8:15 PM - 11:59 PM ET -> 01:10 - 04:50 UTC Tue & Fri)
    - cron: '*/10 1-4 * * 2,5'
    # Thanksgiving / Black Friday / Holiday games (Wed/Thu/Fri/Sat afternoon-night ET)
    - cron: '*/10 18-23 * * 4,5,6'
    - cron: '*/10 1-4 * * 4,6,0'

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas matplotlib
      - name: Run tracker
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python tracker.py
      - name: Save updated chart and log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add win_prob_log.csv win_prob_chart.png
          git commit -m "Update win probability chart" || exit 0
          git push
