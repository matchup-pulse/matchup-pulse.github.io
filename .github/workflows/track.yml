name: Track ESPN Win Probability

on:
  workflow_dispatch:
  schedule:
    # Every 10 mins during live game windows (UTC)
    - cron: '*/10 18-23 * * 0'
    - cron: '*/10 0-4 * * 1'
    - cron: '*/10 1-4 * * 2,5'
    - cron: '*/10 18-23 * * 4,5,6'
    - cron: '*/10 1-4 * * 4,6,0'

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run tracker
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python tracker.py
      - name: Save updated logs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add win_prob_log.csv logs/ || true
          git commit -m "Update win probability logs" || exit 0
          git push
